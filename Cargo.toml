[workspace]
resolver = "2"
members = [
    "crates/fastuse-proto",
    "crates/fastuse-core",
    "crates/fastuse-win",
    "crates/fastuse-daemon",
    "crates/fastuse-mcp",
    "crates/fastuse-cli",
    "crates/fastuse-eval",
    "xtask",
]

[workspace.package]
version = "2.3.1"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Windows bindings — exact-pinned per D-12 (uiautomation 0.24.4 strictly requires windows 0.62.2)
windows = "=0.62.2"
windows-core = "=0.62.2"
uiautomation = "=0.24.4"

# Async runtime / IPC
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }
interprocess = { version = "2.4.2", features = ["tokio"] }

# MCP
rmcp = "1.6.0"

# CLI
clap = { version = "4.6", features = ["derive"] }

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"

# Wire format
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Errors / utils
thiserror = "1"
anyhow = "1"
once_cell = "1"
scopeguard = "1"
dashmap = "6"

# Build helpers
embed-resource = "2"

# Lint AST
syn = { version = "2", features = ["full", "visit"] }
walkdir = "2"

# Phase 3 capture / encode
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"

# Phase 3 benches
criterion = "0.5"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "unwind"  # D-13: required for modifier-leak guard (Phase 2) and Drop-based COM cleanup
strip = true

[profile.dev]
opt-level = 0
