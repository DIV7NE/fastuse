[package]
name = "fastuse-win"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fastuse-proto = { path = "../fastuse-proto" }
fastuse-core = { path = "../fastuse-core" }
once_cell = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "sync", "time", "process"] }
base64 = "0.22"

[features]
default = []
# Test-only: swap real SendInput for an in-process recorder. Production
# builds NEVER enable this. See input/sendinput.rs MockSink.
mock-sendinput = []

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }
windows-core = { workspace = true }
uiautomation = { workspace = true }
