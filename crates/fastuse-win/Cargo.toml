[package]
name = "fastuse-win"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fastuse-proto = { path = "../fastuse-proto" }
fastuse-core = { path = "../fastuse-core" }
once_cell = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
base64 = { workspace = true }
# WR-04: cooperative sleep inside wait_for_element when running under
# the daemon's spawn_blocking pool. We only need rt+time features.
tokio = { workspace = true, features = ["rt", "time"] }

[features]
default = []
# Test-only: swap real SendInput for an in-process recorder. Production
# builds NEVER enable this. See input/sendinput.rs MockSink.
mock-sendinput = []

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = { workspace = true }
uiautomation = { workspace = true }
