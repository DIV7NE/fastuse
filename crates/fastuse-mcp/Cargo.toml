[package]
name = "fastuse-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "fastuse-mcp"
path = "src/main.rs"

[dependencies]
fastuse-proto = { path = "../fastuse-proto", features = ["schema"] }
fastuse-core = { path = "../fastuse-core" }
fastuse-win = { path = "../fastuse-win" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
schemars = "1"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[build-dependencies]
embed-resource = { workspace = true }
