[package]
name = "fastuse-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { workspace = true }
postcard = { workspace = true }
thiserror = { workspace = true }
schemars = { version = "1.0", optional = true }

[features]
default = []
# Enables JsonSchema derives on the wire types so fastuse-mcp can publish
# MCP tool input schemas without re-declaring them.
schema = ["dep:schemars"]
