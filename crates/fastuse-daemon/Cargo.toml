[package]
name = "fastuse-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "fastuse-daemon"
path = "src/main.rs"

[dependencies]
fastuse-proto = { path = "../fastuse-proto" }
fastuse-core = { path = "../fastuse-core" }
fastuse-win = { path = "../fastuse-win" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process", "signal"] }
interprocess = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
once_cell = { workspace = true }
scopeguard = { workspace = true }
clap = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_RemoteDesktop",
] }

[dev-dependencies]
fastuse-proto = { path = "../fastuse-proto" }
fastuse-core = { path = "../fastuse-core" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }
serde_json = { workspace = true }

[build-dependencies]
embed-resource = { workspace = true }
